# 觅搭 · 本地开发基础设施（仅 MySQL + Redis）
#
# 为什么单独一份：
#   script/docker-compose/docker-compose.yml 是全栈部署版，
#   需要先 mvn package 生成 jar、还要前端 dist，开发调试时用不上。
#   这里只起数据库和缓存，后端用 IDE 或 mvn spring-boot:run 直接跑。
#
# 端口约定（与《后续工作交接.md》附录 B 一致）：
#   MySQL 3307  ← 不是 3306，避免和本机已有实例冲突
#   Redis 6379
#
# 用法：
#   cd ruoyi-vue-pro/script/docker-compose
#   docker compose -f docker-compose-dev.yml up -d
#   docker compose -f docker-compose-dev.yml ps
#
# 首次启动会自动执行初始化 SQL，按文件名顺序：
#   01-底座表 → 02-quartz → 03~09 业务表（M1~M7）

name: mida-dev

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
      # 开发环境用 root + 空密码，方便直连；生产务必改掉
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 初始化脚本按文件名顺序执行，仅当数据卷为空时生效
      - type: bind
        source: ../../sql/mysql/ruoyi-vue-pro.sql
        target: /docker-entrypoint-initdb.d/01-ruoyi-vue-pro.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../sql/mysql/quartz.sql
        target: /docker-entrypoint-initdb.d/02-quartz.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../sql/mate/M1__auth.sql
        target: /docker-entrypoint-initdb.d/03-M1__auth.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../sql/mate/M2__match.sql
        target: /docker-entrypoint-initdb.d/04-M2__match.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../sql/mate/M3__im.sql
        target: /docker-entrypoint-initdb.d/05-M3__im.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../sql/mate/M4__trade.sql
        target: /docker-entrypoint-initdb.d/06-M4__trade.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../sql/mate/M5__moment.sql
        target: /docker-entrypoint-initdb.d/07-M5__moment.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../sql/mate/M6__risk.sql
        target: /docker-entrypoint-initdb.d/08-M6__risk.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../sql/mate/M7__goods.sql
        target: /docker-entrypoint-initdb.d/09-M7__goods.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # 初始化期间 MySQL 先用临时实例，不监听 TCP；能连通 127.0.0.1 即表示初始化完成
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data: